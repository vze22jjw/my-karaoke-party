---
version: '3.8'

services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.57.0-jammy
    container_name: mykaraoke-e2e
    working_dir: /app
    shm_size: '4gb'
    environment:
      - BASE_URL=${BASE_URL}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - CI=true
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.pnpm-store
    networks:
      - mykaraokenetwork
    command: >
      /bin/sh -c "
      npm install -g pnpm &&
      pnpm install &&
      ${TEST_COMMAND:-npx playwright test}"

networks:
  mykaraokenetwork:
    external: true
