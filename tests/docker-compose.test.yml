---
version: '3.8'

services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.57.0-jammy
    container_name: mykaraoke-e2e
    working_dir: /app
    shm_size: '4gb'
    env_file:
      - ../.env
    environment:
      - BASE_URL=${BASE_URL:-http://mykaraoke-app:3000}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change_this_value_here}
      - CI=true
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.pnpm-store
    networks:
      - my-karaoke-party_mykaraokenetwork
    command: >
      /bin/sh -c "
      npm install -g pnpm &&
      pnpm install &&
      ${TEST_COMMAND:-npx playwright test}"

networks:
  my-karaoke-party_mykaraokenetwork:
    external: true
